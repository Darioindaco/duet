[package]
name = "duet_engine"
version = "0.3.0"
edition = "2021"

[lib]
name = "duet_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
# extension-module is switched on by maturin (pyproject.toml), not here, so
# `cargo test` can still link against libpython on every platform
pyo3 = { version = "0.25", features = ["abi3-py39"] }
cpal = "0.15"
rtrb = "0.3"
rand = "0.8"
nam-rs = "0.4"
vst3 = "0.3"
libloading = "0.8"
base64 = "0.22"
serde_json = "1"
hound = "3.5"
# time-stretch and pitch-shift (Signalsmith Stretch, MIT): keep-pitch speed changes and transposing
ssstretch = "0.1"
# stem splitting: Demucs (Meta, MIT) as ONNX, run with ONNX Runtime (linked in statically)
# (optional: ONNX Runtime has no ready-made build for Intel Macs; the Intel
# build is made without it, and says so when you try to split)
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native"], optional = true }
realfft = "3"
# reading MP3, M4A/AAC/ALAC (iPhone recordings), FLAC, AIFF, Ogg Vorbis
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "alac", "flac", "aiff", "pcm", "wav", "ogg", "vorbis"] }
midir = "0.10"

[target.'cfg(windows)'.dependencies]
cpal = { version = "0.15", features = ["asio"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSGraphics", "NSRunningApplication", "NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSThread"] }

[features]
default = ["stems"]
stems = ["dep:ort"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"   # a panic in the audio thread must not take Python down with it

[[example]]
name = "test_gain"
crate-type = ["cdylib"]

[[example]]
name = "test_synth"
crate-type = ["cdylib"]

