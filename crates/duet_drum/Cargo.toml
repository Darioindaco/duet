[package]
name = "duet_drum"
version = "0.1.0"
edition = "2021"
description = "Physically modelled drums for Duet: nonlinear modal synthesis (floor tom, v1)"
publish = false

# (a crate of its own, not part of engine/: `cargo test` here links no pyo3 or
# audio drivers. The engine can take it as a path dependency later.)

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# prepare-time only: the symmetric eigenproblem of the axisymmetric block
nalgebra = { version = "0.33", default-features = false, features = ["std"] }

[dev-dependencies]
hound = "3.5"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "voice"
harness = false
