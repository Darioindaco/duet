name: build

# Mac minutes count ten times against the account's Actions minutes, Linux
# minutes once. So every push gets a quick test on Linux (the engine's unit
# tests and the whole self-test, no sound card needed), and the Mac apps are
# only built for main, or when you ask: Actions → build → Run workflow.
# Windows likewise ([release]), or on its own with [windows] in the commit message;
# the Mac apps on their own (no release) with [mac]. The Intel Mac app only with [intel]
# in the message (or a manual run / version tag): it's the slowest build.
on:
  push:
  workflow_dispatch:

# a newer push to the same branch stops the run that's still going for the older one
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev
          pip install numpy maturin
      - name: Build the Rust engine
        run: pip install ./engine
      - name: Engine unit tests
        working-directory: engine
        run: cargo test --release
      - name: Build the test VST3 plugins (for the host tests in the self-test)
        working-directory: engine
        run: cargo build --release --example test_gain --example test_synth
      - name: The stem model (for the stems self-test; skipped if it isn't published yet)
        run: |
          curl -fsSL -o htdemucs.onnx https://github.com/${{ github.repository }}/releases/download/models-htdemucs-1/htdemucs.onnx \
            && echo "DUET_STEM_MODEL=$PWD/htdemucs.onnx" >> "$GITHUB_ENV" || echo "no model release yet"
      - name: Self-test
        run: python selftest.py

  mac:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[mac]')
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon (M1 and newer) always; macos-14 runners stopped starting. Older Intel
        # MacBooks only when asked for ([intel], a manual run or a version tag): every Intel Mac
        # that runs macOS 11+ is Haswell or newer, so AVX2/FMA are always there (NAM's maths runs
        # much faster with them); there's no ready-made ONNX Runtime for Intel Macs, so it's
        # built without the stem splitter.
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[intel]')) && '[{"os":"macos-15","arch":"apple-silicon","rustflags":"","cargo_args":""},{"os":"macos-15-intel","arch":"intel","rustflags":"-C target-cpu=haswell","cargo_args":"--no-default-features"}]' || '[{"os":"macos-15","arch":"apple-silicon","rustflags":"","cargo_args":""}]') }}
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      MATURIN_PEP517_ARGS: ${{ matrix.cargo_args }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the engine's compiled dependencies kept between runs (the first build of a day takes longest)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: ${{ matrix.arch }}
      - name: Install
        run: pip install -r requirements.txt pyinstaller maturin
      - name: Build the Rust engine
        run: pip install ./engine
      # for a release the Linux job already ran these (and the self-test below runs on the Mac):
      # skipping them here saves a whole second compile
      - name: Engine unit tests
        if: ${{ !contains(github.event.head_commit.message, '[release]') }}
        working-directory: engine
        run: cargo test --release ${{ matrix.cargo_args }}
      - name: Build the test VST3 plugins (for the host tests in the self-test)
        working-directory: engine
        run: cargo build --release ${{ matrix.cargo_args }} --example test_gain --example test_synth
      - name: Self-test
        run: python selftest.py
      - name: Build Duet.app
        run: pyinstaller --noconfirm duet.spec
      - name: Smoke test (app must start and stay up)
        run: |
          ./dist/Duet.app/Contents/MacOS/Duet > app.log 2>&1 &
          PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then
            echo "app is running"; kill $PID
          else
            echo "app exited early:"; cat app.log; exit 1
          fi
      - name: Zip
        run: ditto -c -k --keepParent dist/Duet.app Duet-mac-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Duet-mac-${{ matrix.arch }}
          path: Duet-mac-${{ matrix.arch }}.zip

  # Windows: Duet.exe (one file). Built with the Mac apps for a release, or on its own
  # with [windows] in the commit message.
  windows:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[windows]')
    runs-on: windows-latest
    env:
      # the ASIO bindings are made with bindgen, which needs libclang (LLVM is on the runner)
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # see engine/.cargo/config.toml (also here, for builds started outside engine/)
      CXXFLAGS_x86_64_pc_windows_msvc: /Zc:__cplusplus
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Install
        run: pip install -r requirements.txt pyinstaller maturin
      - name: Build the Rust engine
        run: pip install ./engine
      - name: Engine unit tests
        working-directory: engine
        run: cargo test --release
      - name: Build the test VST3 plugins (for the host tests in the self-test)
        working-directory: engine
        run: cargo build --release --example test_gain --example test_synth
      - name: The stem model (for the stems self-test; skipped if it isn't published yet)
        run: |
          curl -fsSL -o htdemucs.onnx https://github.com/${{ github.repository }}/releases/download/models-htdemucs-1/htdemucs.onnx \
            && echo "DUET_STEM_MODEL=$PWD/htdemucs.onnx" >> "$GITHUB_ENV" || echo "no model release yet"
      - name: Self-test
        run: python selftest.py
      - name: Build Duet.exe
        run: pyinstaller --noconfirm duet.spec
      - name: Smoke test (app must start and stay up)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Duet.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "app exited early (code $($p.ExitCode))"; exit 1 }
          Write-Host "app is running"
          Stop-Process -Id $p.Id -Force
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\Duet.exe -DestinationPath Duet-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Duet-windows
          path: Duet-windows.zip

  # the stem splitter's model (Demucs htdemucs as ONNX), made once from Meta's
  # published weights and kept as a release of its own: a commit with [models]
  # in its message makes it again (the app checks the file's SHA-256)
  model:
    if: contains(github.event.head_commit.message, '[models]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install demucs==4.0.1 onnx
      - name: Export
        run: |
          python tools/export_demucs.py htdemucs.onnx
          sha256sum htdemucs.onnx | tee htdemucs.onnx.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete models-htdemucs-1 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create models-htdemucs-1 htdemucs.onnx htdemucs.onnx.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Stem splitter model (htdemucs)" --prerelease \
            --notes "Demucs htdemucs (Meta, MIT licence) exported to ONNX for Duet's stem splitter by tools/export_demucs.py. Duet downloads it by itself the first time you split a clip into stems."

  # a manual run (Actions -> build -> Run workflow), a version tag (v1.2.3) or a
  # commit with [release] in its message also publishes the apps as a release, on the Releases page
  # (the Mac apps are a must; Windows goes in when its build made it)
  release:
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.mac.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]'))
    needs: [test, mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag goes on the commit the apps were built from: GitHub orders the Releases page by
          # the tagged commit's date, so a tag on an old commit puts a new build at the bottom.
          # A new tag on a commit whose workflow files differ from the default branch's needs the
          # "workflows" permission, which this token can't have (HTTP 403); only then does it tag
          # the default branch instead (the notes still say which commit the apps came from).
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"
          else tag="build-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"; fi
          notes="Builds of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Mac: Apple Silicon (M1 and newer) Duet-mac-apple-silicon.zip, older Intel Macs Duet-mac-intel.zip (when it was built); unsigned: the first time, right-click the app -> Open (or run: xattr -cr Duet.app). Windows (if it's there): Duet-windows.zip, unzip and run Duet.exe; SmartScreen warns because it isn't signed: More info -> Run anyway. Always the newest: https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          publish() { gh release create "$tag" dist/*.zip --repo "$GITHUB_REPOSITORY" --target "$1" --latest --title "Duet ${tag}" --notes "$notes"; }
          publish "$GITHUB_SHA" || { [ "$GITHUB_REF_TYPE" != tag ] && publish "${{ github.event.repository.default_branch }}"; }
